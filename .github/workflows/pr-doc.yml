name: PR Doc

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve document path
        id: doc
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          slug="${HEAD_REF//\//-}"
          path="docs/pr/${slug}.src.html"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          if [ -f "${path}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${path} が無いため PR ドキュメントの生成をスキップします"
          fi

      # 画像を data URI にして 1 ファイルに畳む。archive: false は単一ファイルしか
      # 受け付けないため、画像を別ファイルで持てない。
      - name: Build single-file HTML
        if: steps.doc.outputs.found == 'true'
        run: python3 tools/pr-doc/embed_images.py "${{ steps.doc.outputs.path }}" -o pr-doc.html

      # archive: false は単一ファイル限定で、ファイル名がそのまま artifact 名になる。
      - name: Upload HTML
        if: steps.doc.outputs.found == 'true'
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: pr-doc.html
          archive: false
          overwrite: true
          retention-days: 14

      - name: Update PR description
        if: steps.doc.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > pr-body.md
          node tools/pr-doc/update-body.mjs pr-body.md "$ARTIFACT_URL" "$RUN_URL"
          gh pr edit "$PR_NUMBER" --body-file pr-body.md
